<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Saurabh Kumar Portfolio</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#070a13" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #070a13;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 540px;
        padding: 2.5rem 1.5rem;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        background: rgba(6, 182, 212, 0.1);
        color: #22d3ee;
        border: 1px solid rgba(6, 182, 212, 0.3);
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 3.5rem;
        margin: 0 0 0.5rem 0;
        background: linear-gradient(135deg, #22d3ee 0%, #34d399 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h2 {
        font-size: 1.5rem;
        margin: 0 0 1rem 0;
        color: #e2e8f0;
      }
      p {
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, #06b6d4 0%, #10b981 100%);
        color: #070a13;
        text-decoration: none;
        font-weight: 600;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">Error 404</div>
      <h1>404</h1>
      <h2>Resource Not Found</h2>
      <p>The page or route you are attempting to access does not exist on Saurabh Kumar's executive portfolio. Please return to the official homepage.</p>
      <a href="./" class="btn">
        <span>Return to Executive Portfolio</span>
        <span>→</span>
      </a>
    </div>
  </body>
</html>
